name: tmp-stock
on:
  push:
    branches: [tmp-stock]
    paths: [tmp-stock/queries.json, tmp-stock/get.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          if [ -f tmp-stock/get.json ] && git diff --name-only HEAD~1 | grep -q get.json; then python tmp-stock/get.py; else python tmp-stock/search.py; fi
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp-stock/out tmp-stock/full 2>/dev/null; git commit -m "results [skip ci]" && git push
