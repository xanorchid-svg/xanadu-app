name: tmp-stock
on:
  push:
    branches: [tmp-stock]
    paths: [tmp-stock/cands.json, tmp-stock/get.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: pip install pillow
      - run: |
          if git diff --name-only HEAD~1 | grep -q get.json; then python tmp-stock/get.py; else python tmp-stock/sheets.py; fi
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp-stock/out tmp-stock/full 2>/dev/null; git commit -m "results [skip ci]" && git pull --rebase -q && git push
